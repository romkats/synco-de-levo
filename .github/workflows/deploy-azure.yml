name: Deploy Frontend & Backend to Azure Web App

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Frontend & Backend
    outputs:
      backend-artifact: ${{ steps.backend-artifact.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      # Frontend Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Backend Build
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend dependencies
        working-directory: ./backend
        run: dotnet restore

      - name: Build backend
        working-directory: ./backend
        run: dotnet build --configuration Release --no-restore

      - name: Publish backend
        working-directory: ./backend
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Set backend artifact path
        id: backend-artifact
        run: echo "path=backend/publish" >> $GITHUB_OUTPUT

      # Package with SPA
      - name: Create backend deployment package with SPA
        run: |
          # Copy frontend dist to backend wwwroot
          mkdir -p backend/publish/wwwroot
          cp -r frontend/dist/* backend/publish/wwwroot/
          
          cd backend/publish
          zip -r ../../backend-deploy.zip .
          cd ../..

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: backend-deploy.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Azure
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy
          path: .

      # Deploy Backend with SPA to Azure Web App
      - name: Deploy backend with SPA to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend-deploy.zip
          slot-name: production
          clean: true
          restart: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "Backend with SPA deployed to: ${{ secrets.AZURE_WEBAPP_NAME }}"
