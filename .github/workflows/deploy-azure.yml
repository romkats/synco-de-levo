name: Deploy Frontend & Backend to Azure Web App

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Frontend & Backend
    outputs:
      backend-artifact: ${{ steps.backend-artifact.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      # Backend Build
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend dependencies
        working-directory: ./backend
        run: dotnet restore

      - name: Build backend
        working-directory: ./backend
        run: dotnet build --configuration Release --no-restore

      - name: Publish backend
        working-directory: ./backend
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Set backend artifact path
        id: backend-artifact
        run: echo "path=backend/publish" >> $GITHUB_OUTPUT

      # Frontend Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Upload artifacts
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/publish
          retention-days: 1

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Azure
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend/publish

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Deploy Backend to Azure Web App
      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend/publish
          slot-name: production
          clean: true
          restart: true
          type: zip

      # Deploy Frontend to Azure Static Web App
      - name: Deploy frontend to Azure Static Web App
        id: deploy-frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/dist"
          api_location: ""
          output_location: "./frontend/dist"
          skip_api_build: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "Backend deployed to: ${{ secrets.AZURE_WEBAPP_NAME }}"
          echo "Frontend deployment status: ${{ steps.deploy-frontend.outcome }}"
